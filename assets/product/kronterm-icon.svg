<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
    <style>
        .kronterm-cube {
            --kronterm-cube-edge: #343b45;
            --kronterm-cube-top: #fbfcfe;
            --kronterm-cube-left: #e5e9ee;
            --kronterm-cube-right: #f2f4f7;
            --kronterm-cube-inset: #535d6b;
        }
        @media (prefers-color-scheme: dark) {
